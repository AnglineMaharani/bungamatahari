<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<title>Bunga Matahari :)</title>

<style>

* {
    padding: 0;
    margin: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}


/* Background utama */
body {
    display: flex;
    width: 100%;
    height: 100vh;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #ffffff,
        #e8f5e9,
        #fff59d
    );
}


/* Kotak password */
.container {

    width: 300px;
    text-align: center;
    padding: 25px;

    background: linear-gradient(
        160deg,
        #ffffff,
        #f1f8e9,
        #fffde7
    );

    border-radius: 18px;

    box-shadow:
    0 8px 20px rgba(76,120,50,0.25);
}


/* Judul */
.container h2 {

    font-size: 1.7rem;
    color: #33691e;

}


/* Tampilan password */
.input-display {

    text-align: center;

    margin: 10px 0;

    font-size: 30px;

    color: #558b2f;

    letter-spacing: 5px;

}


/* Grid tombol */
.keypad {

    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 10px;

}


/* Tombol angka */
.keypad button {

    padding: 15px;

    font-size: 25px;

    color: #33691e;

    font-weight: 500;


    background: linear-gradient(
        135deg,
        #c8e6c9,
        #fff59d
    );


    border:

    1px solid #7cb342;


    border-radius: 10px;


    cursor: pointer;


    transition: all .3s ease;

}


/* Animasi tombol */
.keypad button:hover {

    background: linear-gradient(
        135deg,
        #81c784,
        #ffd54f
    );


    transform: scale(1.08);

    box-shadow:

    0 5px 12px rgba(100,120,50,0.3);

}


/* Tombol angka 0 di tengah */
.keypad button:last-child {

    grid-column: 2/3;

}


/* Animasi masuk */
.container {

    animation: muncul 0.8s ease;

}


@keyframes muncul {

    from {

        opacity:0;

        transform: translateY(-30px);

    }


    to {

        opacity:1;

        transform: translateY(0);

    }

}


</style>

</head>


<body>



<div class="container">


<h2>
🌻<br>
Masukkan Ulang Tahun Orang Keren
</h2>


<div class="input-display" id="inputDisplay">
••••
</div>



<div class="keypad">

<button class="key" onclick="enterDigit('1')">1</button>

<button class="key" onclick="enterDigit('2')">2</button>

<button class="key" onclick="enterDigit('3')">3</button>


<button class="key" onclick="enterDigit('4')">4</button>

<button class="key" onclick="enterDigit('5')">5</button>

<button class="key" onclick="enterDigit('6')">6</button>


<button class="key" onclick="enterDigit('7')">7</button>

<button class="key" onclick="enterDigit('9')">9</button>

<button class="key" onclick="enterDigit('8')">8</button>


<button class="key" onclick="enterDigit('0')">0</button>


</div>


</div>



<script>


const correctPassword = "1208";


const display =
document.getElementById("inputDisplay");


let input = "";


function enterDigit(digit) {


    if (input.length < 4) {

        input += digit;

    }


    display.textContent = input.padEnd(4, "•");



    if (input.length === 4) {


        if (input === correctPassword) {


            sessionStorage.setItem(
                "playMusic",
                "true"
            );


            window.location.href = "flower.html";


        } else {


            alert(
            "Masukkan tanggal ulang tahun orang keren"
            );


            input = "";


            display.textContent = "••••";


        }

    }


}

</script>


</body>

</html>
